name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: baton
          POSTGRES_USER: baton
          POSTGRES_PASSWORD: baton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baton -d baton"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://baton:baton@localhost:5432/baton
      TEST_DATABASE_URL: postgres://baton:baton@localhost:5432/baton
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baton/database build && pnpm db:migrate
      - run: pnpm check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # Cross-compile gate: every release target must build on every push.
  # (Tests run on unix; Windows runtime validation is manual for now.)
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "building $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/baton
          done

  # Canary (REQUIREMENTS §8): adapter tests against committed fixtures run
  # in `test`; this job additionally exercises the newest claude-code CLI's
  # slug/storage behavior so format drift surfaces as a red canary, not a
  # user bug report. Non-blocking by design.
  canary:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: fixture parse canary
        run: go test ./internal/adapters/... -run . -count=1
