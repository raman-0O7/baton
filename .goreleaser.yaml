version: 2
project_name: baton

builds:
  - main: ./cmd/baton
    binary: baton
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

# Homebrew tap (optional, later): create <owner>/homebrew-tap, set
# HOMEBREW_TAP_GITHUB_TOKEN in repo secrets, then uncomment.
